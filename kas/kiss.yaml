header:
  version: 11

distro: kiss
target: kiss-image

repos:
  bitbake:
    url: "https://git.openembedded.org/bitbake"
    branch: "2.18"
    layers:
      .: disabled

  openembedded-core:
    url: "https://git.openembedded.org/openembedded-core"
    branch: wrynose
    layers:
      meta:

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    branch: wrynose
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-kiss:
    layers:
      meta-kiss:

local_conf_header:
  meta-kiss: |
    # Some useful lines you may want to copy to your local.conf for development
    # INHERIT += "rm_work"
    # OE_FRAGMENTS += 'core/yocto/root-login-with-empty-password'
